name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib
          p = pathlib.Path("skills/numo-agent-talk/SKILL.md")
          text = p.read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md must open with frontmatter"
          fm = text.split("---", 2)[1]
          for field in ("name:", "description:"):
              assert field in fm, f"missing {field}"
          name = [l for l in fm.splitlines() if l.startswith("name:")][0].split(":", 1)[1].strip()
          assert name == p.parent.name, f"name {name} != folder {p.parent.name}"
          desc = fm.split("description:", 1)[1].split("\nlicense:", 1)[0].strip()
          assert len(desc) <= 1024, f"description too long: {len(desc)}"
          print("frontmatter ok, description", len(desc), "chars")
          PY

      - name: evals json
        run: python3 -c "import json;json.load(open('skills/numo-agent-talk/evals/evals.json'));print('evals ok')"

      - name: forbidden patterns
        run: |
          python3 - <<'PY'
          import pathlib, sys, re
          bad = []
          for p in pathlib.Path(".").rglob("*.md"):
              if ".github" in p.parts:
                  continue
              for i, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if "\u2014" in line and "цитат" not in line:
                      bad.append(f"{p}:{i}: long dash")
                  if re.search(r"/Users/", line):
                      bad.append(f"{p}:{i}: absolute home path")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("forbidden patterns ok")
          PY
